name: Xcode-Tests

# Baut ein Xcode-Projekt für den Simulator und führt auf Wunsch die Tests aus.
# Signiert wird mit den Simulator-Einstellungen des Projekts, sofern
# ohne-signierung nicht gesetzt ist.

on:
  workflow_call:
    inputs:
      projekt:
        description: "Pfad zur .xcodeproj oder .xcworkspace"
        type: string
        required: true
      schema:
        type: string
        required: true
      aktion:
        description: "test oder build"
        type: string
        default: test
      test-ziel:
        description: "Nur dieses Test-Target ausführen (-only-testing)"
        type: string
        default: ""
      runner:
        type: string
        default: macos-26
      xcode:
        description: "neuestes (stabiles Xcode des Runners), vorgabe (nicht wechseln) oder Pfad zur Xcode.app"
        type: string
        default: neuestes
      ohne-signierung:
        description: "Ohne Signierung bauen"
        type: boolean
        default: false
      vorbereitung:
        description: "Befehl vor dem Build, z. B. Platzhalter für fehlende Dateien"
        type: string
        default: ""
      artefakt:
        description: "Datei, die nach dem Lauf als Artefakt bereitsteht, z. B. Package.resolved"
        type: string
        default: ""
      timeout:
        description: "Minuten"
        type: number
        default: 40

permissions:
  contents: read

jobs:
  xcode:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Eingaben prüfen
        env:
          PROJEKT: ${{ inputs.projekt }}
          AKTION: ${{ inputs.aktion }}
        run: |
          case "$AKTION" in test|build) ;; *) echo "::error::aktion muss test oder build sein."; exit 1 ;; esac
          case "$PROJEKT" in
            *.xcodeproj) echo "PROJEKT_ART=-project" >> "$GITHUB_ENV" ;;
            *.xcworkspace) echo "PROJEKT_ART=-workspace" >> "$GITHUB_ENV" ;;
            *) echo "::error::projekt muss auf .xcodeproj oder .xcworkspace enden."; exit 1 ;;
          esac
          [ -e "$PROJEKT" ] || { echo "::error::$PROJEKT gibt es nicht."; exit 1; }

      - name: Xcode wählen
        env:
          XCODE: ${{ inputs.xcode }}
        run: |
          case "$XCODE" in
            vorgabe) ;;
            neuestes)
              ziel=$(printf '%s\n' /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
              [ -d "$ziel" ] || ziel=/Applications/Xcode.app
              sudo xcode-select -s "$ziel/Contents/Developer" ;;
            *) sudo xcode-select -s "$XCODE/Contents/Developer" ;;
          esac
          xcodebuild -version

      - name: Simulator wählen
        if: inputs.aktion == 'test'
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          geraete = json.load(sys.stdin)["devices"]
          laufzeiten = sorted((r for r in geraete if "iOS" in r), reverse=True)
          for r in laufzeiten:
              for g in geraete[r]:
                  if g["name"].startswith("iPhone"):
                      print(g["udid"]); sys.exit()
          sys.exit("Kein iPhone-Simulator verfügbar")')
          echo "ZIEL=id=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Vorbereiten
        if: inputs.vorbereitung != ''
        env:
          VORBEREITUNG: ${{ inputs.vorbereitung }}
        run: bash -eo pipefail -c "$VORBEREITUNG"

      - name: Ausführen
        env:
          PROJEKT: ${{ inputs.projekt }}
          SCHEMA: ${{ inputs.schema }}
          AKTION: ${{ inputs.aktion }}
          TEST_ZIEL: ${{ inputs.test-ziel }}
          OHNE_SIGNIERUNG: ${{ inputs.ohne-signierung }}
        run: |
          args=("$PROJEKT_ART" "$PROJEKT" -scheme "$SCHEMA"
            -destination "${ZIEL:-generic/platform=iOS Simulator}"
            -derivedDataPath "$RUNNER_TEMP/DerivedData")
          if [ "$AKTION" = test ]; then
            args+=(-resultBundlePath "$RUNNER_TEMP/Tests.xcresult")
            if [ -n "$TEST_ZIEL" ]; then args+=("-only-testing:$TEST_ZIEL"); fi
          fi
          if [ "$OHNE_SIGNIERUNG" = true ]; then
            args+=(CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=)
          fi
          status=0
          xcodebuild "$AKTION" "${args[@]}" > "$RUNNER_TEMP/xcode.log" 2>&1 || status=$?
          grep -E "error:|failed|\*\* (TEST|BUILD)" "$RUNNER_TEMP/xcode.log" | tail -60 || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Fehlerkontext"
            grep -n -B3 -A8 -E "error:|Command .* failed" "$RUNNER_TEMP/xcode.log" | tail -n 250 || true
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Ergebnis zusammenfassen
        if: always() && inputs.aktion == 'test'
        run: |
          [ -d "$RUNNER_TEMP/Tests.xcresult" ] || { echo "Kein Ergebnis-Bundle."; exit 0; }
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Tests.xcresult" --compact \
            | python3 -c '
          import json, os, sys
          s = json.load(sys.stdin)
          werte = [s.get(k) for k in ("totalTestCount", "passedTests", "failedTests", "skippedTests")]
          zeile = "{} Tests: {} bestanden, {} fehlgeschlagen, {} übersprungen".format(*werte)
          print(zeile)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### " + zeile + "\n")'

      - name: Log bereitstellen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-log
          path: ${{ runner.temp }}/xcode.log

      - name: Artefakt bereitstellen
        if: always() && inputs.artefakt != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artefakt
          path: ${{ inputs.artefakt }}
          if-no-files-found: warn
