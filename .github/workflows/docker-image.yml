name: Docker-Image

# Baut ein Docker-Image und lädt es in eine Registry (Standard: ghcr.io). In
# Pull Requests wird nur gebaut. Ist `pruefung` gesetzt, läuft sie gegen das
# fertige Image, bevor irgendetwas hochgeladen wird.

on:
  workflow_call:
    inputs:
      image:
        description: "Name ohne Tag, z. B. ghcr.io/besitzer/projekt/server"
        type: string
        required: true
      kontext:
        description: "Build-Kontext"
        type: string
        default: "."
      dockerfile:
        description: "Leer: Dockerfile im Kontext"
        type: string
        default: ""
      plattformen:
        type: string
        default: linux/amd64
      build-args:
        description: "Zeilen NAME=wert"
        type: string
        default: ""
      tags:
        description: "Regeln für docker/metadata-action. Leer: latest auf dem Standard-Branch, sha-<commit>, bei Versions-Tags die Version"
        type: string
        default: ""
      hochladen:
        description: "false: nur bauen (in Pull Requests immer)"
        type: boolean
        default: true
      node-version:
        description: "Node für die Vorbereitung; leer: keins"
        type: string
        default: ""
      vorbereitung:
        description: "Befehl vor dem Build, z. B. ein Frontend bauen"
        type: string
        default: ""
      pruefung:
        description: "Befehl gegen das gebaute Image (in $PRUEFLING), bevor hochgeladen wird"
        type: string
        default: ""
      registry-benutzer:
        description: "Leer bei ghcr.io: der auslösende Benutzer"
        type: string
        default: ""
    secrets:
      registry-token:
        description: "Leer bei ghcr.io: GITHUB_TOKEN des Aufrufers"
        required: false
    outputs:
      digest:
        description: "Digest des hochgeladenen Images"
        value: ${{ jobs.bauen.outputs.digest }}

# Rechte setzt der Aufrufer: contents: read, für ghcr.io dazu packages: write.

env:
  STANDARD_TAGS: |
    type=raw,value=latest,enable={{is_default_branch}}
    type=sha,prefix=sha-,format=long
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}

jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Eingaben prüfen
        env:
          IMAGE_EINGABE: ${{ inputs.image }}
          HOCHLADEN: ${{ inputs.hochladen && github.event_name != 'pull_request' }}
        run: |
          image=$(printf '%s' "$IMAGE_EINGABE" | tr '[:upper:]' '[:lower:]')
          case "$image" in */*) ;; *) echo "::error::image braucht die Form registry/besitzer/name."; exit 1 ;; esac
          case "${image##*/}" in *:*|*@*) echo "::error::image ohne Tag oder Digest angeben."; exit 1 ;; esac
          erster=${image%%/*}
          case "$erster" in
            *.*|*:*) registry=$erster ;;
            *) registry=docker.io ;;
          esac
          {
            echo "IMAGE=$image"
            echo "REGISTRY=$registry"
            echo "HOCHLADEN=$HOCHLADEN"
          } >> "$GITHUB_ENV"
          echo "Image $image, Registry $registry, hochladen: $HOCHLADEN"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Vorbereiten
        if: inputs.vorbereitung != ''
        env:
          VORBEREITUNG: ${{ inputs.vorbereitung }}
        run: bash -eo pipefail -c "$VORBEREITUNG"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.plattformen != 'linux/amd64'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags != '' && inputs.tags || env.STANDARD_TAGS }}

      - name: Image für die Prüfung bauen
        if: inputs.pruefung != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.kontext }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          load: true
          tags: pruefling:lokal
          cache-from: type=gha,scope=${{ env.IMAGE }}

      - name: Image prüfen
        if: inputs.pruefung != ''
        env:
          PRUEFUNG: ${{ inputs.pruefung }}
          PRUEFLING: pruefling:lokal
        run: bash -eo pipefail -c "$PRUEFUNG"

      - name: Bei der Registry anmelden
        if: env.HOCHLADEN == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ inputs.registry-benutzer != '' && inputs.registry-benutzer || github.actor }}
          password: ${{ secrets.registry-token != '' && secrets.registry-token || github.token }}

      - name: Bauen und hochladen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.kontext }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.plattformen }}
          push: ${{ env.HOCHLADEN == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

      - name: Zusammenfassen
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            if [ "$HOCHLADEN" = "true" ]; then echo "### Hochgeladen: \`$IMAGE\`"; else echo "### Gebaut, nicht hochgeladen: \`$IMAGE\`"; fi
            echo
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then echo "- \`$tag\`"; fi
            done <<< "$TAGS"
            if [ -n "$DIGEST" ]; then echo "- Digest \`$DIGEST\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
