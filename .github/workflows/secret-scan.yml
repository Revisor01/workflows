name: Secret-Scan

# Prüft neue Commits sowie Titel und Beschreibung eines PR auf Zugangsdaten und
# Interna. Muster für eigene Server kommen aus dem Secret GITLEAKS_EXTRA_RULES
# des Aufrufers, damit sie nicht im Repo stehen. Ohne PR- oder Push-Ereignis
# (z. B. von Hand gestartet) wird die ganze Historie geprüft.

on:
  workflow_call:
    inputs:
      konfiguration:
        description: "gitleaks-Konfiguration im aufrufenden Repo"
        type: string
        default: .gitleaks.toml
    secrets:
      GITLEAKS_EXTRA_RULES:
        required: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks installieren
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tgz

      - name: Konfiguration zusammensetzen
        env:
          EXTRA_RULES: ${{ secrets.GITLEAKS_EXTRA_RULES }}
          KONFIGURATION: ${{ inputs.konfiguration }}
        run: |
          if [ ! -f "$KONFIGURATION" ]; then
            echo "::error::$KONFIGURATION fehlt im Repo."; exit 1
          fi
          cp "$KONFIGURATION" "$RUNNER_TEMP/gitleaks.toml"
          if [ -n "$EXTRA_RULES" ]; then
            printf '\n%s\n' "$EXTRA_RULES" >> "$RUNNER_TEMP/gitleaks.toml"
          else
            echo "::warning::GITLEAKS_EXTRA_RULES fehlt, eigene Hostnamen werden nicht geprüft."
          fi

      - name: Commits prüfen
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="${BASE_SHA}..${HEAD_SHA}" ;;
            push)
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="$AFTER"
              else
                range="${BEFORE}..${AFTER}"
              fi ;;
            *) range="--all" ;;
          esac
          echo "Prüfbereich: $range"
          set +e
          gitleaks git . --config "$RUNNER_TEMP/gitleaks.toml" --redact --no-banner \
            --exit-code 3 --log-opts="$range"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "::error::Treffer in den Commits. Wert erneuern, dann aufräumen."
            exit 1
          elif [ "$status" -ne 0 ]; then
            echo "::error::gitleaks ist mit Status $status abgebrochen."
            exit "$status"
          fi
          echo "Prüfung ohne Treffer."

      - name: PR-Titel und -Beschreibung prüfen
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | gitleaks stdin \
            --config "$RUNNER_TEMP/gitleaks.toml" --redact --no-banner --exit-code 3
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "::error::Treffer in Titel oder Beschreibung des PR. Text bearbeiten; der alte Stand bleibt im Verlauf sichtbar."
            exit 1
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "Prüfung ohne Treffer."
