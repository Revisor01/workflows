name: Prüfen

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Der eigene Baustein prüft dieses Repo; so läuft er bei jeder Änderung mit.
  scan:
    uses: ./.github/workflows/secret-scan.yml
    secrets:
      GITLEAKS_EXTRA_RULES: ${{ secrets.GITLEAKS_EXTRA_RULES }}

  # Baut ein Probe-Image und prüft es, ohne hochzuladen.
  docker-image:
    uses: ./.github/workflows/docker-image.yml
    with:
      image: ghcr.io/${{ github.repository }}/probe
      kontext: test/docker
      build-args: GRUSS=hallo
      hochladen: false
      pruefung: test "$(docker run --rm "$PRUEFLING")" = hallo

  # Play-Upload gegen einen nachgebauten Play-Server, ohne Google-Konto.
  play-upload-selbsttest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Selbsttest
        run: python3 -I test/play-upload/selbsttest.py .github/workflows/play-upload.yml

  # Der Baustein selbst, nur mit der Prüfung vor dem Bau.
  play-upload:
    uses: ./.github/workflows/play-upload.yml
    with:
      paket: de.example.app
      tracks: " internal , production"
      release-notes-datei: test/play-upload/neuigkeiten.txt
      nur-pruefen: true

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
